name: q2438-windows-repro

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Workflow mode
        required: true
        default: reference
        type: choice
        options:
          - reference
          - verify

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.6
      - name: Install locked dependency
        shell: pwsh
        run: python -m pip install PyYAML==6.0.2
      - name: Record Windows host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence|Out-Null
          [ordered]@{caption=(Get-CimInstance Win32_OperatingSystem).Caption;version=(Get-CimInstance Win32_OperatingSystem).Version;build=(Get-CimInstance Win32_OperatingSystem).BuildNumber;runner_image=$env:ImageOS;commit_sha=$env:GITHUB_SHA;workflow_run_id=$env:GITHUB_RUN_ID}|ConvertTo-Json|Set-Content -Encoding utf8NoBOM evidence/windows-host.json
          kubectl version --client=true -o json|Set-Content -Encoding utf8NoBOM evidence/kubectl-version.json
      - name: Generate Reference candidate
        if: ${{ inputs.mode == 'reference' }}
        shell: pwsh
        run: |
          $env:KUBECTL_PATH=(Get-Command kubectl).Source
          python qa/generate_reference.py
      - name: Verify final attachments
        if: ${{ inputs.mode == 'verify' }}
        shell: pwsh
        run: |
          $pythonPath=(Get-Command python).Source
          $kubectlPath=(Get-Command kubectl).Source
          New-NetFirewallRule -DisplayName q2438-python-no-external -Direction Outbound -Program $pythonPath -Action Block|Out-Null
          New-NetFirewallRule -DisplayName q2438-kubectl-no-external -Direction Outbound -Program $kubectlPath -Action Block|Out-Null
          Get-NetFirewallRule -DisplayName q2438-*-no-external|Select-Object DisplayName,Enabled,Direction,Action|ConvertTo-Json|Set-Content -Encoding utf8NoBOM evidence/network-guard.json
          $env:KUBECTL_PATH=$kubectlPath
          python qa/verify_hashes.py
          python qa/windows_verify.py
      - name: Remove network guard
        if: always()
        shell: pwsh
        run: Get-NetFirewallRule -DisplayName q2438-*-no-external -ErrorAction SilentlyContinue|Remove-NetFirewallRule
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q2438-windows-evidence
          path: evidence/**
          if-no-files-found: error
          retention-days: 1
